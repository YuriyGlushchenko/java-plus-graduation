services:

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    networks:
      - ewm
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10


#  ewm-db:
#    image: postgres:16.1
#    container_name: ewm-db
#    networks:
#      - ewm
#    environment:
#      POSTGRES_DB: ewm
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: postgres
#    ports:
#      - "5432:5432"
#    healthcheck:
#      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
#      timeout: 5s
#      interval: 5s
#      retries: 10


  users-db:
    image: postgres:16.1
    container_name: users-db
    networks:
      - ewm
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10


  events-db:
    image: postgres:16.1
    container_name: events-db
    networks:
      - ewm
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  requests-db:
    image: postgres:16.1
    container_name: requests-db
    networks:
      - ewm
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  comments-db:
    image: postgres:16.1
    container_name: comments-db
    networks:
      - ewm
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  discovery-server:
    build: ./infra/discovery-server
    container_name: discovery-server
    networks:
      - ewm
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8761/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s



  config-server:
    build: ./infra/config-server
    container_name: config-server
    networks:
      - ewm
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - MANAGEMENT_SERVER_PORT=8084
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://discovery-server:8761/eureka/apps/CONFIG-SERVER"] #  Используем как healthcheck то, что config-server успешно регистрируется в Eureka.
      interval: 10s
      timeout: 5s
      retries: 10

  stats-server:
    build: ./stats-service/stats-server
    container_name: stats-server
    networks:
      - ewm
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://discovery-server:8761/eureka/apps/STATS-SERVER"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  ewm-service:
    build: ./core/main-service
    container_name: ewm-main-service
    networks:
      - ewm
    depends_on:
      ewm-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
#      stats-server:
#        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ewm-db:5432/ewm
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://discovery-server:8761/eureka/apps/MAIN-SERVICE"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway-server:
    build: ./infra/gateway-server
    container_name: gateway-server
    networks:
      - ewm
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
#      ewm-service:
#        condition: service_healthy
#      stats-server:
#        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

networks:
  ewm:
    driver: bridge

