syntax = "proto3";

package stats.service.collector; // имя пакета в мире gRPC/Protobuf - используется только в работе с gRPC, может не совпадать с пакетами java и с папками

import "google/protobuf/empty.proto";
import "recommendations/messages/UserActionProto.proto";

//option java_package = "ru.yandex.practicum.grpc.telemetry.event"; // можно указать, в какой пакет будут складываться сгенерированные классы.
option java_outer_classname = "UserActionControllerProto";

service UserActionController {
  rpc CollectUserAction (UserActionProto)
      returns (google.protobuf.Empty);
}