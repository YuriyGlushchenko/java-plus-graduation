spring:
  config:
    import: "optional:configserver:"

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:events-service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

  instance:
    hostname: localhost
    non-secure-port: 0


stats-service: # имя под которым сервис статистики зарегистрирован в eureca
  id: stats-server

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 50
      failureRateThreshold: 50
      waitDurationInOpenState: 10000 # 10 секунд в миллисекундах
      permittedNumberOfCallsInHalfOpenState: 3
      slidingWindowType: COUNT_BASED
      minimumNumberOfCalls: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
  instances:
    request-service:
      baseConfig: default
    user-service:
      baseConfig: default
    comment-service:
      baseConfig: default

app:
  name: ${spring.application.name:events-service}