server:
  port: ${PORT:0}


spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/core/{application}
            - classpath:config/infra/{application}
            - classpath:config/stats/{application}
    retry:
      max-attempts: 20           # количество попыток
      initial-interval: 2000     # начальная задержка в мс (2 секунды)
      multiplier: 1.0            # множитель для увеличения интервала (1.0 - без увеличения)
      max-interval: 2000         # максимальный интервал

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    instance-id: "${spring.application.name}:${random.value}"  # уникальный ID экземпляра
    hostname: localhost


logging:
  level:
    org.springframework.cloud.config.server: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: TRACE
